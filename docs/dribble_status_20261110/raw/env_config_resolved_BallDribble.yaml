      - left_knee_link
      - left_ankle_roll_link
      - right_hip_roll_link
      - right_knee_link
      - right_ankle_roll_link
    weight: 0.4
  motion_leg_ang_vel:
    func: soccer.tasks.tracking.mdp.rewards:motion_relative_body_angular_velocity_error_exp
