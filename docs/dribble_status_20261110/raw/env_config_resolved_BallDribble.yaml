terminations:
  time_out:
    func: isaaclab.envs.mdp.terminations:time_out
    params: {}
    time_out: true
  anchor_pos_z:
    func: soccer.tasks.tracking.mdp.terminations:bad_anchor_pos_z_only
    params:
      command_name: motion
      threshold: 0.32
    time_out: false
  anchor_ori:
    func: soccer.tasks.tracking.mdp.terminations:bad_anchor_ori
    params:
      asset_cfg:
        name: robot
        joint_names: null
        joint_ids: slice(None, None, None)
        fixed_tendon_names: null
        fixed_tendon_ids: slice(None, None, None)
        body_names: null
        body_ids: slice(None, None, None)
        object_collection_names: null
        object_collection_ids: slice(None, None, None)
        preserve_order: false
      command_name: motion
      threshold: 0.8
    time_out: false
  ee_body_pos:
    func: soccer.tasks.tracking.mdp.terminations:bad_motion_body_pos_z_only
    params:
      command_name: motion
      threshold: 0.25
      body_names:
      - left_ankle_roll_link
      - right_ankle_roll_link
      - left_wrist_yaw_link
      - right_wrist_yaw_link
      grace_steps_after_resample: 20
    time_out: false
  motion_clip_end:
    func: soccer.tasks.tracking.mdp.terminations:motion_clip_finished
    params:
      command_name: motion
    time_out: true
  ball_lost:
    func: soccer.tasks.tracking.mdp.terminations:ball_lost_dribbling
    params:
      command_name: motion
      max_distance: 1.1
      max_vel_divergence: 0.0
      grace_steps: 0
    time_out: false
  nonfoot_ball_contact:
    func: soccer.tasks.tracking.mdp.ball_contact:nonfoot_ball_contact
    params: {}
    time_out: false
