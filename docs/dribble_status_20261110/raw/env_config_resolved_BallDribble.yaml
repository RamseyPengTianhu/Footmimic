events:
  physics_material:
    func: isaaclab.envs.mdp.events:randomize_rigid_body_material
    params:
      asset_cfg:
        name: robot
        joint_names: null
        joint_ids: slice(None, None, None)
        fixed_tendon_names: null
        fixed_tendon_ids: slice(None, None, None)
        body_names: .*
        body_ids: slice(None, None, None)
        object_collection_names: null
        object_collection_ids: slice(None, None, None)
        preserve_order: false
      static_friction_range:
      - 0.3
      - 1.6
      dynamic_friction_range:
      - 0.3
      - 1.2
      restitution_range:
      - 0.0
      - 0.5
      num_buckets: 64
    mode: startup
    interval_range_s: null
    is_global_time: false
    min_step_count_between_reset: 0
  add_joint_default_pos:
    func: soccer.tasks.tracking.mdp.events:randomize_joint_default_pos
    params:
      asset_cfg:
        name: robot
        joint_names:
        - .*
        joint_ids: slice(None, None, None)
        fixed_tendon_names: null
        fixed_tendon_ids: slice(None, None, None)
        body_names: null
        body_ids: slice(None, None, None)
        object_collection_names: null
        object_collection_ids: slice(None, None, None)
        preserve_order: false
      pos_distribution_params:
      - -0.01
      - 0.01
      operation: add
    mode: startup
    interval_range_s: null
    is_global_time: false
    min_step_count_between_reset: 0
  base_com:
    func: soccer.tasks.tracking.mdp.events:randomize_rigid_body_com
    params:
      asset_cfg:
        name: robot
        joint_names: null
        joint_ids: slice(None, None, None)
        fixed_tendon_names: null
        fixed_tendon_ids: slice(None, None, None)
        body_names: torso_link
        body_ids: slice(None, None, None)
        object_collection_names: null
        object_collection_ids: slice(None, None, None)
        preserve_order: false
      com_range:
        x:
        - -0.025
        - 0.025
        y:
        - -0.05
        - 0.05
        z:
        - -0.05
        - 0.05
    mode: startup
    interval_range_s: null
    is_global_time: false
    min_step_count_between_reset: 0
  push_robot:
    func: isaaclab.envs.mdp.events:push_by_setting_velocity
    params:
      velocity_range:
        x:
        - -0.5
        - 0.5
        y:
        - -0.5
        - 0.5
        z:
        - -0.2
        - 0.2
        roll:
        - -0.52
        - 0.52
        pitch:
        - -0.52
        - 0.52
        yaw:
        - -0.78
        - 0.78
    mode: interval
    interval_range_s:
    - 1.0
    - 3.0
    is_global_time: false
    min_step_count_between_reset: 0
  ball_deceleration:
    func: soccer.tasks.tracking.mdp.ball_physics:ball_constant_deceleration_event
    params: {}
    mode: interval
    interval_range_s:
    - 0.02
    - 0.02
    is_global_time: true
    min_step_count_between_reset: 0
